name: Fork secret scan

on:
  push:
    branches: ['main', 'fork/**', 'prepare/public-fork-*']
  pull_request:
    branches: ['main', 'fork/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Prove narrow scanner exceptions
        run: PYTHONDONTWRITEBYTECODE=1 python3 fork/scripts/test_secret_policy.py
      - name: Scan complete fork history including removed files
        shell: bash
        run: |
          set -euo pipefail
          base=$(tr -d '\n' < fork/UPSTREAM_BASELINE)
          git merge-base --is-ancestor "$base" HEAD
          gitleaks git . --log-opts="$base..HEAD" \
            --config fork/gitleaks.toml --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color --timeout 300
      - name: Public generation privacy preflight
        if: startsWith(github.ref, 'refs/heads/fork/') || startsWith(github.base_ref, 'fork/')
        run: python3 fork/scripts/audit.py publication
