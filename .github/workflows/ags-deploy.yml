name: AGS deploy handoff

on:
  workflow_run:
    workflows: ['Fork CI']
    types: [completed]
    branches: [fork/main.20260924]

permissions:
  actions: read
  contents: read

concurrency:
  group: ags-deploy-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: >-
      vars.AGS_AUTODEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'fork/main.20260924' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.repository == 'yoyooyooo/agent-git-service'
    environment: ags-autodeploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted handoff implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Join private deployment network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Verify CI network identity
        env:
          DAGU_HEALTH_URL: ${{ vars.TS_DAGU_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          tailscale status --json | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s.get("BackendState")=="Running" and s.get("Self",{}).get("Online") is True and s.get("Self",{}).get("Tags")==["tag:ci"], "CI Tailscale identity unavailable"'
          curl --fail --silent --show-error --max-time 20 "${DAGU_HEALTH_URL:?TS_DAGU_HEALTH_URL is required}" >/dev/null
      - name: Send one idempotent CI handoff
        env:
          GH_TOKEN: ${{ github.token }}
          AGS_DEPLOY_WEBHOOK_URL: ${{ vars.AGS_DEPLOY_WEBHOOK_URL }}
          AGS_DEPLOY_WEBHOOK_TOKEN: ${{ secrets.AGS_DEPLOY_WEBHOOK_TOKEN }}
        run: python3 scripts/ags-deploy-handoff.py
