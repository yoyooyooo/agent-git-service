name: Dependency license check
on:
  push:
    branches: ['main', 'fork/**', 'prepare/public-fork-*']
    paths: ['go.mod', 'go.sum', 'LICENSE', 'NOTICE', 'scripts/license_check.py', '.github/workflows/license-check.yml']
  pull_request:
    branches: ['main', 'fork/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-license-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 scripts/license_check.py --report "$RUNNER_TEMP/dependency-licenses.tsv"
