name: Native adapter isolation

# Not release-required evidence. Default off. A skipped or unrun result is UNVERIFIED,
# not a pass. This workflow does not call launchctl or systemctl.
on:
  workflow_dispatch:
    inputs:
      native_probe:
        description: Run the injected native sequence only. Not a real service probe.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-adapter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-isolated:
    name: Native adapter isolation
    if: github.event_name == 'workflow_dispatch' && inputs.native_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run injected native sequence only
        env:
          NATIVE_LABEL: ags-s6b-once-${{ github.run_id }}
        run: |
          test "${NATIVE_LABEL#*once}" != "$NATIVE_LABEL"
          python3 scripts/test_native_probe_sequence.py -q
