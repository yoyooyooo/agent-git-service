name: AGS network probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ags-network-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch &&
      github.repository == 'yoyooyooo/agent-git-service'
    environment: ags-autodeploy-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Verify CI network identity
        env:
          DAGU_HEALTH_URL: ${{ vars.TS_DAGU_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          tailscale status --json | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s.get("BackendState")=="Running" and s.get("Self",{}).get("Online") is True and s.get("Self",{}).get("Tags")==["tag:ci"], "CI Tailscale identity unavailable"'
          curl --fail --silent --show-error --max-time 20 "${DAGU_HEALTH_URL:?TS_DAGU_HEALTH_URL is required}" >/dev/null
      - name: Read-only webhook reachability
        env:
          AGS_DEPLOY_WEBHOOK_URL: ${{ vars.AGS_DEPLOY_WEBHOOK_URL }}
        run: python3 scripts/ags-deploy-probe.py
