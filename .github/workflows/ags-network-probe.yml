name: AGS network probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ags-network-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch &&
      github.repository == 'yoyooyooo/agent-git-service'
    environment: ags-autodeploy-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.AGS_DEPLOY_TS_AUTHKEY }}
          tags: tag:ags-deploy-trigger
      - name: Read-only webhook reachability
        env:
          AGS_DEPLOY_WEBHOOK_URL: ${{ vars.AGS_DEPLOY_WEBHOOK_URL }}
        run: python3 scripts/ags-deploy-probe.py
