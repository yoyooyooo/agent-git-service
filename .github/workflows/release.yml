name: Release (legacy tag path disabled)

on:
  push:
    tags:
      - 'fork-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  reject:
    if: github.repository_id == '1384519373' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Refuse publication under the retired contract
        shell: bash
        run: |
          echo 'release_source_binding_unverified: tag publication disabled; Ubuntu 24.04/glibc 2.39 is retired for new assets' >&2
          echo 'Tag destination and separated-control-v1 evidence require separate approval. No build, attestation or Release write is permitted.' >&2
          exit 65

# Historical commits still contain their historical workflow. This file cannot
# change what GitHub executes when a tag points to one of those commits.
