name: Fork CI

on:
  push:
    branches: ['main', 'fork/**', 'prepare/public-fork-*']
  pull_request:
    branches: ['main', 'fork/**']
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run every root package, client contracts and race checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GIT_TERMINAL_PROMPT: '0'
  GOMAXPROCS: '2'

jobs:
  checks:
    name: Source and governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify exact source and complete package inventory
        run: |
          python3 fork/scripts/audit.py verify
          bash scripts/check-ci-package-coverage.sh
      - name: Test publication scanner and scoped operator routing
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 fork/scripts/test_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 fork/scripts/test_ci_database.py
          PYTHONDONTWRITEBYTECODE=1 python3 fork/scripts/test_generation.py
          PYTHONDONTWRITEBYTECODE=1 python3 fork/scripts/test_public_ranges.py
          PYTHONDONTWRITEBYTECODE=1 python3 fork/scripts/test_casefold_policy.py
          PYTHONDONTWRITEBYTECODE=1 python3 fork/scripts/test_release.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_edge_client_route.py
          (cd fork/tools && go test ./... -count=1)
      - name: Exercise repaired authorization and transport boundaries
        run: |
          go test -race ./internal/buildinfo ./internal/gitbackend ./internal/gittransport ./config -count=1 -timeout=2m
          go test -race ./internal/service -run '^TestExchangeDeviceCodeRevalidatesApproverBeforeTokenWrite$' -count=3 -timeout=2m
          go test ./internal/edge -run '^TestAliasIngressKeepsCanonicalUpstreamAndReadGates$' -count=1 -timeout=2m
      - name: Check documents
        run: python3 scripts/doc_lint.py
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Check fork Go formatting
        run: |
          base=$(tr -d '\n' < fork/UPSTREAM_BASELINE)
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACM -z "$base" HEAD -- '*.go' ':(exclude)cli/**')
          if ((${#files[@]})); then
            unformatted=$(gofmt -l "${files[@]}")
            test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
          fi

  unit-tests:
    name: Root tests (${{ matrix.name }})
    needs: checks
    # Preparation pushes are intentionally cheap. Release generations and PRs
    # require the complete matrix, or an operator can request it explicitly.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/fork/') || github.ref == 'refs/heads/main' || inputs.full_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: service
            packages: ./internal/service ./internal/service/search
          - name: rest
            packages: ./internal/rest ./internal/rest/respond ./internal/rest/transform
          - name: server-graphql
            packages: ./server ./internal/graphql
          - name: db-router-git
            packages: ./internal/db ./internal/githttp ./internal/gitstore ./internal/gittransport ./internal/router ./internal/testharness ./internal/testharness/testdb ./internal/wikicatalog ./internal/wikiv2
          - name: edge
            packages: ./cmd/ags-edge ./cmd/ags-replication ./internal/edge ./internal/edgeprotocol ./internal/gitbackend ./internal/replication ./internal/replicationadmin ./internal/snapshotstore
          - name: fork-integrations
            packages: ./cmd/forgejo-authority ./internal/delegationpolicy ./internal/executioncontext ./internal/forgejointegration ./internal/githubintegration ./internal/gitlabintegration ./internal/integrations ./internal/multicafailures ./internal/multicaprojection ./internal/notifications ./internal/operationcatalog ./internal/operationconstraints ./internal/projectionwatch ./internal/providerlogbridge ./internal/providerlogprotocol ./internal/sessionauthority ./internal/tenant ./internal/workloadidentity
          - name: misc
            packages: ./auth ./cmd/gh-server ./config ./e2e/cmd/mock-embedding-server ./e2e/cmd/mock-oidc-server ./internal/apperrors ./internal/buildinfo ./internal/connectedlogin ./internal/crypto ./internal/embedding ./internal/httputil ./internal/logging ./internal/mentions ./internal/metrics ./internal/middleware ./internal/oauth ./internal/oidc ./internal/randutil ./internal/ratelimit
    env:
      TEST_DB_DSN: 'root:@tcp(127.0.0.1:45400)/?parseTime=true&timeout=10s'
      PACKAGES: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start disposable loopback-only TiDB
        run: bash fork/scripts/ci-database.sh start
      - name: Run all packages assigned to this shard
        run: |
          read -r -a packages <<< "$PACKAGES"
          go test -p 1 -count=1 -timeout=20m "${packages[@]}"
      - name: Stop disposable database
        if: always()
        run: bash fork/scripts/ci-database.sh stop

  race:
    name: Edge and authority race checks
    needs: checks
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/fork/') || inputs.full_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_DB_DSN: 'root:@tcp(127.0.0.1:45400)/?parseTime=true&timeout=10s'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: bash fork/scripts/ci-database.sh start
      - run: go test -race -p 1 -count=1 -timeout=15m ./internal/edge ./internal/snapshotstore ./internal/gitbackend ./internal/edgeprotocol ./internal/replication
      - run: go test -race ./internal/service -run 'TestExchangeDeviceCode|TestAccessGrantPRMergeConcurrentSameEffect|TestAuthorityBoundaryReceiptConcurrentCapture' -count=3 -timeout=5m
      - if: always()
        run: bash fork/scripts/ci-database.sh stop

  clients:
    name: Vendored client compatibility
    needs: checks
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/fork/') || inputs.full_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            cli/_go-gh-local/go.sum
      - name: Compile complete client
        working-directory: cli
        run: env -u NO_COLOR -u CLICOLOR -u PAGER -u GH_PAGER go test -p 2 ./... -run '^$' -timeout=10m
      - name: Exercise core client contracts
        working-directory: cli
        run: env -u NO_COLOR -u CLICOLOR -u PAGER -u GH_PAGER go test -p 2 ./git ./api ./internal/config ./pkg/cmd/auth/... ./pkg/cmd/repo/clone ./pkg/cmd/pr/create ./pkg/cmd/pr/view ./pkg/cmd/pr/merge -count=1 -timeout=5m
      - name: Exercise complete local API client
        working-directory: cli/_go-gh-local
        run: go test -p 2 ./... -count=1 -timeout=5m
