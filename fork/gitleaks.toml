title = "Fork secret scanning"

[extend]
useDefault = true

# The directory-key check is a function call, not a credential. This exception
# requires both the exact file and the whole call line; it never skips a
# directory, a commit, or another credential on the same file.
# test_secret_policy.py verifies that a synthetic credential next to this line
# is still rejected.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Hex directory-key check is not a credential"
condition = "AND"
paths = ['''(?:^|/)internal/snapshotstore/retention\.go$''']
regexTarget = "line"
regexes = [
  '''^\s*if !item\.IsDir\(\) \|\| !hexDirectoryKey\(key\) \{\s*$''',
  '''^\s*if !item\.IsDir\(\) \|\| len\(key\) != 64 \|\| strings\.Trim\(key, "0123456789abcdef"\) != "" \{\s*$''',
]

# Historical fixture source embeds the old validation alphabet. Restrict this
# exception to that exact non-secret value and the one fixture source.
[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)fork/scripts/test_secret_policy\.py$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef$''']
